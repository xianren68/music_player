[package]
name = "gpui_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2"
gpui-component = "0.5.1"
rfd = "0.15"
lofty = "0.21"
id3 = "1"
# crate 名是 mp3-duration（连字符）；Rust 代码里 import 用下划线 mp3_duration
mp3-duration = "0.1"
rodio = "0.20"
image = "0.25"
smallvec = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
miniz_oxide = "0.8"
souvlaki = "0.8"
raw-window-handle = "0.6"
# Windows 媒体会话(SMTC)直接用 windows crate 的 MediaPlayer 实现，比 souvlaki 的
# GetForWindow(hwnd) 方式更可靠（后者调用成功但系统不弹"正在播放"卡片）
windows = { version = "0.61", features = [
    "Media",
    "Media_Core",
    "Media_Playback",
    "Foundation",
    "Storage",
    "Storage_Streams",
    # ISystemMediaTransportControlsInterop::GetForWindow 需要 Win32 互操作接口
    "Win32_System_WinRT",
] }
